name: NEXORA quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, improve/nexora-storefront]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexora_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexora_test
      JWT_SECRET: nexora-ci-only-secret-never-use-in-production-0123456789
      NODE_ENV: test
      CATALOGUE_LIVE: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm install

      - name: Install frontend dependencies
        working-directory: client
        run: npm install --ignore-scripts

      - name: Check backend JavaScript syntax
        run: |
          find server api -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run unit tests
        run: npm test

      - name: Run PostgreSQL API integration tests
        timeout-minutes: 4
        run: node server/tests/integration.js

      - name: Build frontend
        run: npm run build
