name: Nexora CI

on:
  push:
    branches: [main, "nexora/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci --prefix client
      - name: Build frontend
        run: npm run build --prefix client
      - name: Check backend JavaScript syntax
        run: |
          node --check server/server.js
          node --check server/db.js
          node --check server/middleware/auth.js
          node --check server/routes/auth.js
          node --check server/routes/orders.js
          node --check server/routes/products.js
          node --check server/routes/payments.js
          node --check server/routes/wishlist.js
          node --check server/routes/stats.js
