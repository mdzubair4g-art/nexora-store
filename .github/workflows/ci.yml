name: NEXORA quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, improve/nexora-storefront]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm install

      - name: Install frontend dependencies
        working-directory: client
        run: npm install --ignore-scripts

      - name: Check backend JavaScript syntax
        run: |
          find server api -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run authentication tests
        run: npm test

      - name: Build frontend
        run: npm run build
